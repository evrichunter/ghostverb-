name: Build GHOST VERB (Windows x64 VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2022     # pinned: has Visual Studio 2022 (the "17 2022" generator below)
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Every native command is its own step: a failing cmake/ctest fails the job immediately.
      - name: Configure (Release, x64) - downloads JUCE 8.0.6
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGHOSTVERB_BUILD_TESTS=ON

      - name: Build VST3 (target GhostVerb_VST3, Release)
        run: cmake --build build --config Release --target GhostVerb_VST3 --parallel

      - name: Build tests
        run: cmake --build build --config Release --target GhostVerbTests GhostVerbCaptureStress --parallel

      - name: Run tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Verify the VST3 exists and collect it
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "GHOST VERB.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { throw "GHOST VERB.vst3 was not generated" }
          $bin = Get-ChildItem -Path $vst3.FullName -Recurse -File -Filter "*.vst3" | Select-Object -First 1
          if (-not $bin) { throw "VST3 binary missing inside the bundle" }
          Write-Host "OK: $($bin.FullName) ($([math]::Round($bin.Length/1MB,2)) MB)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName "dist\GHOST VERB.vst3"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist\

      - name: Upload artifact (download it from the Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-VERB-1.0.0-Windows-x64-VST3
          path: dist/
          if-no-files-found: error

      - name: Zip for release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\* -DestinationPath GHOST-VERB-1.0.0-Windows-x64-VST3.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GHOST-VERB-1.0.0-Windows-x64-VST3.zip
